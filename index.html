<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juliette · Natural motion study</title>
<style>
:root{color-scheme:light;--gold:#ffe6a3;--sage:#8faa78;--ink:#303a28;--paper:#fff9e9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}body{background:var(--gold);overflow-x:hidden}
.scenery{position:fixed;inset:0;pointer-events:none;overflow:hidden}#mesh{background:#ffe6a3}#mesh i{position:absolute;inset:-45%;background:radial-gradient(ellipse at 40% 45%,#8faa78 0%,#8faa78bb 24%,#8faa7800 57%);will-change:transform}#mesh i+i{background:radial-gradient(ellipse at 55% 50%,#ffe6a3 0%,#ffe6a3ee 22%,#ffe6a300 57%)}#flowers{z-index:1}#flowers svg{position:absolute;left:0;top:0;overflow:visible;will-change:transform}
main{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;padding:28px 44px 22px;gap:28px}header,footer{display:flex;justify-content:space-between;align-items:center;gap:18px}h1{font-family:Georgia,serif;font-size:25px;font-weight:400;margin:0;letter-spacing:-.5px}.tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}.caption{font-size:12px;line-height:1.6;margin:0;max-width:320px}
.focus{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;width:min(100%,370px);padding:26px 20px 24px;background:#fff9e9;border:1px solid #49533126;border-radius:24px;box-shadow:0 14px 60px #4b512014}.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 22px}.time{font-size:83px;letter-spacing:-5px;line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums;margin-bottom:14px}.sub{font-size:13px;margin:0 0 24px;color:#536047}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:24px;border:1px solid #5e714f;background:#fff9e9;color:#303a28;padding:0 19px;font-size:13px}button:focus-visible{outline:3px solid #303a28;outline-offset:3px}.start{background:#405335;color:#fff9e9;border-color:#405335;min-width:160px}.actions{display:flex;gap:8px}.reset{padding:0 14px}
.motion{display:flex;align-items:center;gap:3px;background:#fff9e9;border:1px solid #6c7b59;border-radius:25px;padding:3px}.motion button{padding:0 14px;border:none;background:transparent;min-height:44px}.motion button[aria-pressed=true]{background:#405335;color:#fff9e9}.footer-copy{background:#fff9e9;padding:8px 13px;border-radius:13px}.mode-note{display:block;font-size:11px;line-height:1.5;color:#536047}footer{align-items:end}
@media(max-width:600px){main{padding:21px 18px 18px;gap:24px}header{align-items:start}h1{font-size:24px}header .tag{font-size:9px;letter-spacing:1px;padding-top:7px}.focus{width:min(100%,320px);padding:28px 16px}.time{font-size:76px}.eyebrow{margin-bottom:17px}footer{align-items:center;flex-direction:column;gap:13px}.footer-copy{text-align:center}.caption{font-size:11px}.motion button{padding:0 18px}}
@media(max-height:610px) and (min-width:601px){main{padding-top:18px;gap:14px}.focus{padding:18px}.eyebrow{margin-bottom:12px}.time{font-size:68px}.sub{margin-bottom:16px}}
</style>
<div id="mesh" class="scenery" aria-hidden="true"><i></i><i></i></div><div id="flowers" class="scenery" aria-hidden="true"></div>
<main><header><h1>Juliette</h1><span class="tag">Normal · motion study</span></header>
<section class="focus" aria-label="Focus timer"><p class="eyebrow">A little room to focus</p><div class="time" id="time">25:00</div><p class="sub" id="session-note">One thing at a time.</p><div class="actions"><button class="start" id="start">Start focus</button><button class="reset" id="reset" aria-label="Reset focus timer">Reset</button></div></section>
<footer><div class="footer-copy"><p class="caption">Cupped petals. A changing breeze.</p><span class="mode-note" id="motion-note">Isolated visual study · not applied to the app</span></div><div class="motion" role="group" aria-label="Background motion"><button data-mode="gentle" aria-pressed="true">Gentle</button><button data-mode="lively" aria-pressed="false">Lively</button><button data-mode="off" aria-pressed="false">Off</button></div></footer></main>
<script>
'use strict';
// Original software-3D blossom meshes; no images, libraries or network calls.
const cvs=document.querySelector('#flowers'),bg=document.querySelector('#mesh'),fields=[...bg.children],NS='http://www.w3.org/2000/svg';
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio,1.5),seed=731629,mode='gentle',t=0,prev=0,acc=0,raf=0,frames=0,drawMs=[],intervals=[],lastRender=0,wraps=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function rand(){seed|=0;seed=seed+0x6D2B79F5|0;let a=Math.imul(seed^seed>>>15,1|seed);a^=a+Math.imul(a^a>>>7,61|a);return ((a^a>>>14)>>>0)/4294967296}
function resize(){W=innerWidth;H=innerHeight;render()}
const blooms=Array.from({length:18},(_,i)=>({x:rand()*1.15-.075,y:rand()*1.2-.15,z:rand(),vx:(rand()-.5)*.03,vy:.028+rand()*.018,a:(rand()-.5)*2.3,b:(rand()-.5)*2.3,c:rand()*6.28,wa:(rand()-.5)*.5,wb:(rand()-.5)*.6,wc:(rand()-.5)*.6,s:22+rand()*12,phase:rand()*9,noise:0}));
// Curved oval petals: narrow root, broad shoulders, curled rim.
const mesh=[];for(let k=0;k<5;k++){const angle=k*Math.PI*2/5;for(let i=0;i<10;i++)for(let j=0;j<6;j++){const p=[];for(const [u,v] of [[i/10,j/6],[(i+1)/10,j/6],[(i+1)/10,(j+1)/6],[i/10,(j+1)/6]]){const side=v*2-1,r=.10+u*.94,w=Math.pow(Math.sin(Math.PI*u),.51)*.39*side;const z=.5*u*u+.17*side*side*Math.sin(Math.PI*u)-.04; p.push([Math.cos(angle)*r-Math.sin(angle)*w,Math.sin(angle)*r+Math.cos(angle)*w,z])}mesh.push({p,k,u:(i+.5)/10,v:(j+.5)/6})}}
function rotate(p,b){let [x,y,z]=p;let c=Math.cos(b.a),s=Math.sin(b.a);[y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(b.b);s=Math.sin(b.b);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(b.c);s=Math.sin(b.c);return [x*c-y*s,x*s+y*c,z]}
function wind(x,y,z){return {x:Math.sin(y*4.3+t*.31)*.05+Math.cos(x*3.7-y*2.1+t*.19)*.037+Math.sin(t*.47)*.026,y:Math.cos(x*4.6+y*2+t*.26)*.10,z:Math.sin(x*3-y*2+t*.37)*.03}}
function step(dt){t+=dt;const energy=mode==='lively'?1.75:1;for(const b of blooms){const f=wind(b.x,b.y,b.z),drag=1.25+.7*Math.abs(Math.cos(b.a)*Math.cos(b.b));b.noise+=(rand()-.5)*dt*.9;b.noise*=1-dt*.6;b.vx+=(f.x*energy-b.vx)*dt*.8;b.vy+=(.081+f.y*energy-b.vy*drag)*dt*.6;b.x+=b.vx*dt*energy;b.y+=b.vy*dt*energy;b.z+=f.z*dt*.13;b.wa+=((f.x*4+b.noise+.13*Math.sin(t*.67+b.phase))-b.wa*.5)*dt;b.wb+=((f.y*4+.11*Math.cos(t*.51+b.phase))-b.wb*.5)*dt;b.wc+=((f.x*2+.1*Math.sin(b.y*9+b.phase))-b.wc*.7)*dt;b.a+=b.wa*dt;b.b+=b.wb*dt;b.c+=b.wc*dt;if(b.y>1.22){b.y=-.22;b.x=rand();b.vy=.035;wraps++}if(b.x>1.25){b.x=-.25;wraps++}if(b.x<-.25){b.x=1.25;wraps++}}}
function background(){fields[0].style.transform=`translate(${Math.sin(t*.17)*21}%,${Math.cos(t*.21)*15}%) rotate(${t*2.4}deg) scale(${1+Math.sin(t*.14)*.12})`;fields[1].style.transform=`translate(${Math.cos(t*.23)*24}%,${Math.sin(t*.19)*20}%) rotate(${-t*3}deg)`}
for(const b of blooms){b.el=document.createElementNS(NS,'svg');b.el.setAttribute('viewBox','-1.7 -1.7 3.4 3.4');b.paths=Array.from({length:mesh.length+1},()=>{let p=document.createElementNS(NS,'path');b.el.append(p);return p});cvs.append(b.el)}
function blossom(b){const depth=Math.max(0,Math.min(1,b.z)),scale=b.s*(.58+depth*1.35)*(W<600?.78:1),cx=b.x*W,cy=b.y*H;const faces=[];
for(const face of mesh){const p=face.p.map(v=>rotate(v,b)),e=p[1].map((v,i)=>v-p[0][i]),f=p[3].map((v,i)=>v-p[0][i]),n=[e[1]*f[2]-e[2]*f[1],e[2]*f[0]-e[0]*f[2],e[0]*f[1]-e[1]*f[0]],nl=Math.hypot(...n)||1;let light=(n[0]*-.34+n[1]*-.48+n[2]*.8)/nl;const back=n[2]<0;light=back?.82+Math.abs(light)*.11:.84+Math.max(0,light)*.16;light-=.07*(1-face.u);const base=back?[242,230,193]:[255,249,225];faces.push({p,z:p.reduce((a,v)=>a+v[2],0)/4,col:base.map(v=>Math.round(v*light))})}
const center=rotate([0,0,.055],b);faces.push({center,z:center[2],col:[184,144,66]});faces.sort((a,b)=>a.z-b.z);b.el.style.cssText=`width:${scale*3.4}px;height:${scale*3.4}px;transform:translate(${cx-scale*1.7}px,${cy-scale*1.7}px);opacity:${.55+depth*.45};filter:${depth<.23?'blur(.7px)':'none'}`;
faces.forEach((face,i)=>{const path=b.paths[i],color=`rgb(${face.col.join(',')})`;path.setAttribute('fill',color);path.setAttribute('stroke',color);path.setAttribute('stroke-width','.012');path.setAttribute('stroke-linejoin','round');if(face.center){const p=face.center,r=.145,ry=r*Math.max(.15,Math.abs(Math.cos(b.a)*Math.cos(b.b)));path.setAttribute('d',`M${p[0]-r},${p[1]} a${r},${ry} 0 1 0 ${r*2},0 a${r},${ry} 0 1 0 ${-r*2},0`)}else path.setAttribute('d',face.p.map((p,i)=>{let q=3.7/(3.7-p[2]);return `${i?'L':'M'}${(p[0]*q).toFixed(3)},${(p[1]*q).toFixed(3)}`}).join('')+'Z')})}
function render(){const start=performance.now();background();blooms.slice().sort((a,b)=>a.z-b.z).forEach(blossom);drawMs.push(performance.now()-start);if(drawMs.length>720)drawMs.shift();frames++}
function active(){return mode!=='off'&&!reduced.matches&&!document.hidden}
function loop(now){raf=0;if(!active())return;if(prev&&now-prev<30){raf=requestAnimationFrame(loop);return}const dt=prev?Math.min((now-prev)/1000,.12):0;if(lastRender){intervals.push(now-lastRender);if(intervals.length>720)intervals.shift()}lastRender=now;prev=now;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}render();raf=requestAnimationFrame(loop)}
function sync(){cancelAnimationFrame(raf);raf=0;prev=0;lastRender=0;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelector('#motion-note').textContent=reduced.matches?'Reduced motion · still composition':mode==='off'?'Motion off · still composition':'Isolated visual study · not applied to the app';render();if(active())raf=requestAnimationFrame(loop)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;sync()});document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);addEventListener('resize',resize);
let remaining=1500,running=false,timer=0;const startButton=document.querySelector('#start');function timerPaint(){document.querySelector('#time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');startButton.textContent=running?'Pause focus':remaining===1500?'Start focus':'Resume focus'}startButton.onclick=()=>{running=!running;clearInterval(timer);if(running)timer=setInterval(()=>{remaining=Math.max(0,remaining-1);if(!remaining){running=false;clearInterval(timer)}timerPaint()},1000);timerPaint()};document.querySelector('#reset').onclick=()=>{clearInterval(timer);running=false;remaining=1500;timerPaint()};
window.study={get metrics(){const sorted=drawMs.slice().sort((a,b)=>a-b),is=intervals.slice().sort((a,b)=>a-b);return {frames,simulationSeconds:t,flowerCount:blooms.length,facesPerFlower:mesh.length,drawMedianMs:sorted[Math.floor(sorted.length*.5)],drawP95Ms:sorted[Math.floor(sorted.length*.95)],frameMedianMs:is[Math.floor(is.length*.5)],frameP95Ms:is[Math.floor(is.length*.95)],mode,reduced:reduced.matches,hidden:document.hidden,rafScheduled:!!raf,wraps,width:W,height:H}},get poses(){return blooms.map(b=>({x:b.x,y:b.y,a:b.a,b:b.b,c:b.c}))}};
resize();sync();
</script></html>
